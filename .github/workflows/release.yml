name: Release

# Push v0.1.0 for a release, or v0.1.0-rc.1 for a prerelease.
# A manual run builds the RPM and uploads it as an artifact only.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rpm:
    name: Fedora 44 RPM
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 确认版本号
        id: version
        run: bash .github/scripts/release-version.sh

      - name: 准备构建缓存
        uses: actions/cache@v4
        with:
          path: |
            .ci/cargo
            .ci/rustup
            src-tauri/target
          key: fedora44-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/typing-core/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            fedora44-

      - name: 在 Fedora 44 中打包
        run: |
          mkdir -p .ci/cargo .ci/rustup
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            -e CARGO_HOME=/work/.ci/cargo \
            -e RUSTUP_HOME=/work/.ci/rustup \
            -e CI=true \
            fedora:44 \
            bash -euo pipefail /work/.github/scripts/build-rpm.sh

      - name: 修正文件所有者
        run: sudo chown -R "$(id -u):$(id -g)" .ci src-tauri/target node_modules dist

      - name: 上传构建附件
        uses: actions/upload-artifact@v4
        with:
          name: typelet-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Typelet ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Fedora 44 RPM。
          files: src-tauri/target/release/bundle/rpm/*.rpm
          fail_on_unmatched_files: true
